<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị | JaJu Boutique</title>
  <link rel="icon" href="assets/img/emblem.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css?v=8">
</head>
<body>

  <!-- Đăng nhập -->
  <div class="login" data-login hidden>
    <form class="login__card" data-login-form>
      <img src="assets/img/logo.png" alt="JaJu Boutique">
      <h1>Trang quản trị</h1>
      <p>Nhập mật khẩu để quản lý cửa hàng</p>
      <input type="password" name="pw" placeholder="Mật khẩu" autocomplete="current-password" required>
      <p class="login__err" data-login-err></p>
      <button class="btn btn--block" type="submit">Đăng nhập</button>
      <a href="index.html" class="login__back">Quay lại trang bán hàng</a>
    </form>
  </div>

  <!-- Ứng dụng -->
  <div class="app" data-app hidden>
    <aside class="side" data-side>
      <a class="side__brand" href="#overview"><img src="assets/img/logo.png" alt="JaJu Boutique"></a>
      <nav class="side__nav" data-nav></nav>
      <div class="side__foot">
        <a href="index.html" target="_blank" rel="noopener">Xem website</a>
        <button data-action="logout">Đăng xuất</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-sm" data-action="toggle-side" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h1 data-page-title>Tổng quan</h1>
        <span class="status" data-status></span>
        <div class="topbar__actions">
          <button class="btn btn--ghost" data-action="preview"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span>Xem trước</span></button>
          <button class="btn" data-action="publish"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span>Xuất bản</span></button>
        </div>
      </header>
      <main class="content" data-content></main>
    </div>
  </div>

  <!-- Hộp thoại -->
  <div class="dialog" data-dialog hidden>
    <div class="dialog__box">
      <div class="dialog__head"><h2 data-dialog-title></h2><button class="icon-btn" data-action="close-dialog" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="dialog__body" data-dialog-body></div>
      <div class="dialog__foot" data-dialog-foot></div>
    </div>
  </div>

  <div class="toast" data-toast></div>

  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'data/store.js?t=' + Date.now();
      s.onload = s.onerror = function () {
        var a = document.createElement('script');
        a.src = 'assets/js/admin.js?v=8';
        document.body.appendChild(a);
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
